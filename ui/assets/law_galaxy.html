<script>
(()=>{'use strict';

const $=id=>document.getElementById(id),boundary=D.mode==='boundary',spotlight=D.mode==='spotlight',impact=D.mode==='impact'||boundary||spotlight,byId=new Map(D.nodes.map(n=>[n.id,n]));

 if(!n){$('g-details').innerHTML=`<h3>${spotlight?'이 조문이 잇는 경로':impact?'개정 영향의 첫 번째 궤도':'법은 서로를 참조합니다.'}</h3><p>${spotlight?'가운데가 선택한 조문입니다. 민트색은 이 조문이 인용하는 곳, 금색은 이 조문을 인용하는 곳입니다. 점을 선택해 근거를 확인하세요.':boundary?'가운데는 변경된 조문입니다. 점선은 신설 항의 적용 취지를 확인할 연결입니다.':impact?'가운데가 개정 대상입니다. 연결된 조문을 선택하면 저장된 인용 근거가 나타납니다.':'법령을 선택하면 같은 법령군과 드문 연결까지 펼쳐집니다. 별빛 주위의 작은 점은 조문입니다.'}</p><div class="g-divider"></div><div class="g-stat">${D.article_count||D.nodes.length}</div><div class="g-small">${impact?'지도에 표시된 조문':'탐색 가능한 법령'}</div><p>${spotlight?'화살표는 인용 방향입니다. 점선은 선택한 범위에 속하는지 원문 확인이 필요합니다.':impact?'개정 필요성의 확정이 아닌 영향 검토 후보입니다.':'점의 크기는 인용량, 선은 인용하는 법령에서 인용받는 법령으로 향합니다.'}</p>`;return;}
 let html=`<h3>${esc(label(n))}</h3><p>${esc(n.title||n.family)}</p>${n.status?`<span class="g-badge">${esc(n.status)}</span>`:''}<div class="g-divider"></div>`;

 else{html+=`<div class="g-stat">${others.size}</div><div class="g-small">연결된 ${impact?'조문':'법령'}</div>`;[...others].sort((a,b)=>b[1]-a[1]).forEach(([id,count])=>{const o=byId.get(id);html+=`<button type="button" class="g-item" data-node="${esc(id)}" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left"><span>${esc(label(o))}</span><span>${count}</span></button>`})}

}
function select(n){selected=n||null;$('g-select').value=n?.id||'';auto=false;destination=n&&!impact?{x:n.x*.5,y:n.y*.5,z:n.z*.5}:{x:0,y:0,z:0};targetZoom=n&&!impact?1.2:1;panel()}
$('g-select').onchange=e=>select(byId.get(e.target.value));
function reset(){rx=-.16;ry=.28;zoom=targetZoom=1;selected=null;$('g-select').value='';destination={x:0,y:0,z:0};auto=!impact&&motion;panel()}
$('g-reset').onclick=reset;
function motionButton(){$('g-motion').textContent=motion?'움직임 멈춤':'움직임 재생';$('g-motion').setAttribute('aria-pressed',String(!motion))}
$('g-motion').onclick=()=>{motion=!motion;auto=motion&&!selected&&!impact;motionButton()};motionButton();
$('g-full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await root.requestFullscreen()}catch{$('g-full').textContent='독립 HTML에서 사용'}};
function resize(){W=root.clientWidth;H=root.clientHeight;const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}

function project(p){let x=p.x-pan.x,y=p.y-pan.y,z=p.z-pan.z;const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);const xx=x*cy-z*sy;z=x*sy+z*cy;const yy=y*cx-z*sx;z=y*sx+z*cx;const scale=Math.min((W>720?W-300:W-24)/1000,(H-200)/1100)*zoom;const f=1100/(1100+z);return{x:(W>720?(W-260)/2:W/2)+xx*f*scale,y:H*.57+yy*f*scale,z,d:f*scale}}

function draw(ts){
 const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(motion)clock+=dt;if(auto&&!drag)ry+=dt*.025;

 // A restrained galactic haze anchors the selected neighbourhood.

 const active=links(),neighbor=new Set();active.forEach(l=>{neighbor.add(l.a);neighbor.add(l.b)});
 for(const p of D.dust||[]){const q=project(p);const lit=!selected||p.law_id===selected.id;ctx.fillStyle=rgba(p.c,spotlight?.075:lit?.48:.09);ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.45,.9*q.d),0,Math.PI*2);ctx.fill()}
 for(const l of active){const a=byId.get(l.a),b=byId.get(l.b);if(!a||!b)continue;const color=l.color||a.color;ctx.lineWidth=Math.min(2.5,.55+Math.log2(l.n+1)*.22);ctx.strokeStyle=rgba(color,selected||impact?.44:.16);ctx.setLineDash(l.dashed?[6,6]:[]);ctx.beginPath();for(let k=0;k<=24;k++){const q=project(curve(a,b,k/24,l.bend||1));k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.stroke();ctx.setLineDash([]);
  if((selected||impact)&&!l.dashed){const p=project(curve(a,b,.72,l.bend||1)),q=project(curve(a,b,.70,l.bend||1)),ang=Math.atan2(p.y-q.y,p.x-q.x);ctx.fillStyle=rgba(color,.7);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-6*Math.cos(ang-.4),p.y-6*Math.sin(ang-.4));ctx.lineTo(p.x-6*Math.cos(ang+.4),p.y-6*Math.sin(ang+.4));ctx.closePath();ctx.fill()}

 }
 hit=[];const labelBoxes=[];const ordered=D.nodes.map(n=>({n,q:project(n)})).sort((a,b)=>b.q.z-a.q.z);
 for(const {n,q} of ordered){const on=!selected||n.id===selected.id||neighbor.has(n.id),chosen=n.id===selected?.id,rr=Math.max(3,(n.is_target?14:impact?7:4+Math.log2(n.count+1)*.55)*q.d);ctx.globalAlpha=n.context_only?.10:on?1:.18;
  const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr*4);g.addColorStop(0,rgba(n.color,.26));g.addColorStop(1,rgba(n.color,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr*4,0,Math.PI*2);ctx.fill();

  if(show){ctx.font=`${chosen||n.is_target?'600':'400'} ${impact?13:12}px 'Nanum Myeongjo',serif`;ctx.textAlign='center';ctx.fillStyle=on?'#e1eefa':'#7f93ac';ctx.shadowBlur=6;ctx.shadowColor='#020610';ctx.fillText(n.label,q.x,q.y-rr-13);if(n.subtitle){ctx.font="11px 'Nanum Myeongjo',serif";ctx.fillStyle='#9dafc6';ctx.fillText(n.subtitle,q.x,q.y+rr+19)}ctx.shadowBlur=0}

}
function pick(x,y){return [...hit].reverse().find(o=>Math.hypot(o.q.x-x,o.q.y-y)<o.rr)?.n||null}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag={x:e.offsetX,y:e.offsetY,ox:e.offsetX,oy:e.offsetY};auto=false;cv.style.cursor='grabbing'};
cv.onpointermove=e=>{if(drag){ry+=(e.offsetX-drag.x)*.004;rx=Math.max(-1.3,Math.min(1.3,rx+(e.offsetY-drag.y)*.004));drag.x=e.offsetX;drag.y=e.offsetY;return}hover=pick(e.offsetX,e.offsetY);const tip=$('g-tooltip');tip.style.display=hover?'block':'none';if(hover){tip.textContent=label(hover);tip.style.left=Math.min(W-275,e.offsetX+16)+'px';tip.style.top=Math.max(4,e.offsetY-35)+'px'}cv.style.cursor=hover?'pointer':'grab'};
cv.onpointerup=e=>{if(drag&&Math.hypot(e.offsetX-drag.ox,e.offsetY-drag.oy)<6){const n=pick(e.offsetX,e.offsetY);select(n?.id===selected?.id?null:n)}drag=null;cv.style.cursor='grab'};
cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};cv.onpointerleave=()=>{$('g-tooltip').style.display='none';hover=null};
cv.addEventListener('wheel',e=>{e.preventDefault();targetZoom=Math.max(.4,Math.min(2.8,targetZoom*Math.exp(-e.deltaY*.001)))},{passive:false});
cv.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')ry-=.08;if(e.key==='ArrowRight')ry+=.08;if(e.key==='ArrowUp')rx-=.08;if(e.key==='ArrowDown')rx+=.08;if(e.key==='+'||e.key==='=')targetZoom=Math.min(2.8,targetZoom*1.1);if(e.key==='-')targetZoom=Math.max(.4,targetZoom/1.1);if(e.key==='Escape')reset()};
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frameId);if(!document.hidden){last=performance.now();frameId=requestAnimationFrame(draw)}});
Promise.all([document.fonts.load('400 13px "Nanum Myeongjo"'),document.fonts.load('700 13px "Nanum Myeongjo"')]).then(()=>{root.dataset.fonts='loaded'}).catch(()=>{root.dataset.fonts='failed'});
panel();frameId=requestAnimationFrame(draw);
})();
</script>
