 if(n.evidence?.length){html+=`<div class="g-small">연결 근거 ${n.evidence.length}개 · ${esc(kinds[n.kind]||'인용 근거')}</div>`;n.evidence.forEach(e=>html+=`<div class="g-evidence">${e.direction_label?`<strong>${esc(e.direction_label)}</strong><p>${esc(e.source_law)} ${esc(e.source_ref)} → ${esc(e.target_law)} ${esc(e.target_ref)}</p>`:''}${esc(e.raw)}<p>${esc(e.reason)}</p>${e.context?`<details><summary>인용 주변 원문</summary><p style="white-space:pre-wrap">${esc(e.context)}</p></details>`:''}${e.source_effective?`<p>출처 시행일 ${esc(e.source_effective)}${e.target_effective?` · 대상 시행일 ${esc(e.target_effective)}`:''}</p>`:''}${sourceLink(e.source_url,'출처 원문')} ${sourceLink(e.target_url,'대상 원문')}${(e.annex_urls||[]).map((u,i)=>`<p>${sourceLink(u,`별표·서식 원본 ${i+1}`)}</p>`).join('')}${e.question?`<p style="color:#ffd698">${esc(e.question)}</p>`:''}${e.change_summary?`<p>${esc(e.change_summary)}</p>`:''}</div>`)}
 else{html+=`<div class="g-stat">${others.size}</div><div class="g-small">연결된 ${impact?'조문':'법령'}</div>`;[...others].sort((a,b)=>b[1]-a[1]).forEach(([id,count])=>{const o=byId.get(id);html+=`<button type="button" class="g-item" data-node="${esc(id)}" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left"><span>${esc(label(o))}</span><span>${count}</span></button>`})}
 $('g-details').innerHTML=html;root.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>select(byId.get(el.dataset.node)));
}
function select(n){selected=n||null;$('g-select').value=n?.id||'';auto=false;destination=n&&!impact?{x:n.x*.5,y:n.y*.5,z:n.z*.5}:{x:0,y:0,z:0};targetZoom=n&&!impact?1.2:1;panel()}
$('g-select').onchange=e=>select(byId.get(e.target.value));
function reset(){rx=-.16;ry=.28;zoom=targetZoom=1;selected=null;$('g-select').value='';destination={x:0,y:0,z:0};auto=!impact&&motion;panel()}
$('g-reset').onclick=reset;
function motionButton(){$('g-motion').textContent=motion?'움직임 멈춤':'움직임 재생';$('g-motion').setAttribute('aria-pressed',String(!motion))}
$('g-motion').onclick=()=>{motion=!motion;auto=motion&&!selected&&!impact;motionButton()};motionButton();
$('g-full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await root.requestFullscreen()}catch{$('g-full').textContent='독립 HTML에서 사용'}};
function resize(){W=root.clientWidth;H=root.clientHeight;const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(root);resize();
function project(p){let x=p.x-pan.x,y=p.y-pan.y,z=p.z-pan.z;const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);const xx=x*cy-z*sy;z=x*sy+z*cy;const yy=y*cx-z*sx;z=y*sx+z*cx;const inset=W>720&&!infoPanel.hidden?280:0;const scale=Math.min((W-inset-24)/1000,(H-200)/1100)*zoom;const f=1100/(1100+z);return{x:(W-inset)/2+xx*f*scale,y:H*.57+yy*f*scale,z,d:f*scale}}
function curve(a,b,t,bend=1){const lift=(impact?30:65)*bend;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t-Math.sin(Math.PI*t)*lift,z:a.z+(b.z-a.z)*t+Math.sin(Math.PI*t)*35}}
function draw(ts){
 const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(motion)clock+=dt;if(auto&&!drag)ry+=dt*.025;
 const ease=reduced?1:Math.min(1,dt*6);zoom+=(targetZoom-zoom)*ease;for(const k of ['x','y','z'])pan[k]+=(destination[k]-pan[k])*ease;
 ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;
 const bg=ctx.createRadialGradient(W*.38,H*.55,20,W*.38,H*.55,W*.65);bg.addColorStop(0,'#103c3a');bg.addColorStop(.55,'#082728');bg.addColorStop(1,'#03181e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.fillStyle=rgba('#c6d9f1',s.a*(.7+.3*Math.sin(clock*.5+s.x*20)));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()}
 // A restrained galactic haze anchors the selected neighbourhood.
 const haze=ctx.createRadialGradient(W*.35,H*.56,15,W*.35,H*.56,H*.45);haze.addColorStop(0,rgba(impact?'#54dec6':'#8aa98d',.065));haze.addColorStop(1,'transparent');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
 const active=links(),neighbor=new Set();active.forEach(l=>{neighbor.add(l.a);neighbor.add(l.b)});
 for(const p of D.dust||[]){const q=project(p);const lit=!selected||p.law_id===selected.id;ctx.fillStyle=rgba(p.c,spotlight?.075:lit?.48:.09);ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.45,.9*q.d),0,Math.PI*2);ctx.fill()}
 for(const l of active){const a=byId.get(l.a),b=byId.get(l.b);if(!a||!b)continue;const color=l.color||a.color;ctx.lineWidth=Math.min(2.5,.55+Math.log2(l.n+1)*.22);ctx.strokeStyle=rgba(color,selected||impact?.44:.16);ctx.setLineDash(l.dashed?[6,6]:[]);ctx.beginPath();for(let k=0;k<=24;k++){const q=project(curve(a,b,k/24,l.bend||1));k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.stroke();ctx.setLineDash([]);
  if((selected||impact)&&!l.dashed){const p=project(curve(a,b,.72,l.bend||1)),q=project(curve(a,b,.70,l.bend||1)),ang=Math.atan2(p.y-q.y,p.x-q.x);ctx.fillStyle=rgba(color,.7);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-6*Math.cos(ang-.4),p.y-6*Math.sin(ang-.4));ctx.lineTo(p.x-6*Math.cos(ang+.4),p.y-6*Math.sin(ang+.4));ctx.closePath();ctx.fill()}
  const t=(clock*.08+(l.n%13)/13)%1,p=project(curve(a,b,t,l.bend||1));ctx.fillStyle=rgba(color,selected||impact?.95:.4);ctx.shadowBlur=8;ctx.shadowColor=color;ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 }
 hit=[];const labelBoxes=[];const ordered=D.nodes.map(n=>({n,q:project(n)})).sort((a,b)=>b.q.z-a.q.z);
 for(const {n,q} of ordered){const on=!selected||n.id===selected.id||neighbor.has(n.id),chosen=n.id===selected?.id,rr=Math.max(3,(n.is_target?14:impact?7:4+Math.log2(n.count+1)*.55)*q.d);ctx.globalAlpha=n.context_only?.10:on?1:.18;
  const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr*4);g.addColorStop(0,rgba(n.color,.26));g.addColorStop(1,rgba(n.color,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr*4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=rgba(n.color,chosen?.8:.25);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(q.x,q.y,rr*(chosen?2.5:1.9),rr*.85,-.3,0,Math.PI*2);ctx.stroke();ctx.fillStyle=n.color;ctx.shadowBlur=chosen?20:8;ctx.shadowColor=n.color;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x-rr*.22,q.y-rr*.22,Math.max(1,rr*.28),0,Math.PI*2);ctx.fill();
  if(chosen||n.is_target){ctx.strokeStyle=rgba(n.color,.12+.08*Math.sin(clock*1.5));ctx.beginPath();ctx.arc(q.x,q.y,rr*3.4+Math.sin(clock)*3,0,Math.PI*2);ctx.stroke()}
  let show=!n.context_only&&(impact||chosen||hover?.id===n.id||(selected&&neighbor.has(n.id))||n.tier===0);
  if(show&&(spotlight||fsc||localTax||procurement||housing||environment)){ctx.font="13px 'MaruBuri',serif";const width=Math.max(ctx.measureText(n.label).width,ctx.measureText(n.subtitle||'').width)+12,box={x:q.x-width/2,y:q.y-rr-29,w:width,h:rr*2+55};const overlaps=labelBoxes.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y);if(overlaps&&!chosen&&!n.is_target&&hover?.id!==n.id)show=false;else labelBoxes.push(box);}
  if(show){ctx.font=`${chosen||n.is_target?'700':'400'} ${impact?13:12}px 'MaruBuri',serif`;ctx.textAlign='center';ctx.fillStyle=on?'#e1eefa':'#7f93ac';ctx.shadowBlur=6;ctx.shadowColor='#020610';ctx.fillText(n.label,q.x,q.y-rr-13);if(n.subtitle){ctx.font="11px 'MaruBuri',serif";ctx.fillStyle='#9dafc6';ctx.fillText(n.subtitle,q.x,q.y+rr+19)}ctx.shadowBlur=0}
  if(!n.context_only)hit.push({n,q,rr:Math.max(rr+8,14)});
 }ctx.globalAlpha=1;frameId=requestAnimationFrame(draw);
}
function pick(x,y){return [...hit].reverse().find(o=>Math.hypot(o.q.x-x,o.q.y-y)<o.rr)?.n||null}
const gestures=createGalaxyGestures({canvas:cv,getZoom:()=>targetZoom,
 onZoom:value=>{targetZoom=value},
 onRotate:(dx,dy)=>{ry+=dx*.004;rx=Math.max(-1.3,Math.min(1.3,rx+dy*.004))},
 onActive:active=>{drag=active?{}:null;if(active)auto=false;cv.style.cursor=active?'grabbing':'grab'},
 onTap:(x,y)=>{const n=pick(x,y);select(n?.id===selected?.id?null:n)},
 onLeave:()=>{$('g-tooltip').style.display='none';hover=null},
 onHover:(x,y)=>{hover=pick(x,y);sound.hover(hover?.id,x/W);if(!hover)sound.trail(x/W,y/H);const tip=$('g-tooltip');tip.style.display=hover?'block':'none';if(hover){tip.textContent=label(hover);tip.style.left=Math.min(W-275,x+16)+'px';tip.style.top=Math.max(4,y-35)+'px'}cv.style.cursor=hover?'pointer':'grab'}
});
cv.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')ry-=.08;if(e.key==='ArrowRight')ry+=.08;if(e.key==='ArrowUp')rx-=.08;if(e.key==='ArrowDown')rx+=.08;if(e.key==='+'||e.key==='=')targetZoom=Math.min(2.8,targetZoom*1.1);if(e.key==='-')targetZoom=Math.max(.4,targetZoom/1.1);if(e.key==='Escape')reset()};
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frameId);if(!document.hidden){last=performance.now();frameId=requestAnimationFrame(draw)}});
Promise.all([document.fonts.load('400 13px "MaruBuri"'),document.fonts.load('600 13px "MaruBuri"'),document.fonts.load('700 13px "MaruBuri"'),document.fonts.load('600 14px "Pretendard"')]).then(()=>{root.dataset.fonts='loaded'}).catch(()=>{root.dataset.fonts='failed'});
panel();frameId=requestAnimationFrame(draw);
})();
