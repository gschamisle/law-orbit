[project]
name = "law-orbit"
version = "0.1.0"
description = "Law Orbit: statutory citation maps and local amendment review"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.1",
    "lxml>=6.1.0",
    "olefile>=0.47",
    "openai>=2.37.0",
    "pypdf>=6.21.2",
    "pdfplumber>=0.11,<0.12",
    "python-dotenv>=1.2.2",
    "python-hwpx>=2.9.1",
    "pywin32>=312; sys_platform == 'win32'",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[project.optional-dependencies]
presentations = ["python-pptx>=1.0.2"]

[tool.uv]
# Security floors for indirect dependencies; keep the reviewed versions in uv.lock.
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "gitpython>=3.2.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]
