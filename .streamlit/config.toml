# The native widget theme and ui/assets/atlas.css share the same palette.
[theme]
base = "dark"
primaryColor = "#f1d18b"
backgroundColor = "#082c2b"
secondaryBackgroundColor = "#103b38"
textColor = "#f4eedf"
linkColor = "#f1d18b"
borderColor = "#2c514b"
font = "MaruBuri, serif"
baseRadius = "medium"

[theme.sidebar]
backgroundColor = "#062321"
secondaryBackgroundColor = "#164139"
textColor = "#f4eedf"

[server]
maxUploadSize = 50
