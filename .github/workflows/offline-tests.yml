name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.12.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check explicit test inventory without executing discovered files
        run: uv run --frozen python -m scripts.check_test_inventory

      - name: Run registered offline Python tests
        run: uv run --frozen python -m scripts.run_offline_tests

      - name: Run registered offline browser tests
        run: uv run --frozen python -m scripts.run_offline_tests --runtime node
