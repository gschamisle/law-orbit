name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check explicit test inventory without executing discovered files
        run: uv run --frozen python -m scripts.check_test_inventory

      - name: Run registered offline Python tests
        run: uv run --frozen python -m scripts.run_offline_tests

      - name: Run registered offline browser tests
        run: uv run --frozen python -m scripts.run_offline_tests --runtime node
