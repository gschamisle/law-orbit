name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.12.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check explicit test inventory without executing discovered files
        run: uv run --frozen python -m scripts.check_test_inventory

      - name: Run registered offline Python tests
        run: uv run --frozen python -m scripts.run_offline_tests

      - name: Run registered offline browser tests
        run: uv run --frozen python -m scripts.run_offline_tests --runtime node
