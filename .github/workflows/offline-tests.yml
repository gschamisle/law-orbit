name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline test suite
        run: uv run python -m scripts.run_offline_tests
      - name: Check local and public delegation engine
        run: |
          node --test scripts/test_delegation.mjs
          uv run python -m scripts.test_delegation_baseline
