name: Publish free law galaxies

on:
  push:
    branches: [codex/static-galaxies]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-law-galaxies-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - name: Check static-reader engine parity
        run: uv run python -m scripts.test_static_galaxies
      - name: Download and validate pinned public data and browser shell
        run: uv run python -m scripts.fetch_static_release --destination _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public reader
        id: deployment
        uses: actions/deploy-pages@v4
