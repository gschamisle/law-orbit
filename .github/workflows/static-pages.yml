name: Publish Law Orbit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-law-galaxies-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.10'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - name: Check explicit test classification before publication
        run: uv run --frozen python -m scripts.check_test_inventory
      - name: Check browser security and saved-cache boundaries
        run: |
          uv run --frozen python -m scripts.test_web_security
          node --test scripts/test_sw.mjs
      - name: Check static-reader engine parity
        run: uv run --frozen python -m scripts.test_static_galaxies
      - name: Check related-article reading isolation
        run: node --test scripts/test_feedback.mjs scripts/test_reading.mjs scripts/test_annex_reading.mjs scripts/test_annex_links.mjs scripts/test_pageviews.mjs scripts/test_cross_domain.mjs scripts/test_store.mjs
      - name: Check lossless small-file packing
        run: uv run --frozen python -m scripts.test_static_storage
      - name: Check mobile map interaction and scroll mode
        run: node --test scripts/test_galaxy_gestures.cjs
      - name: Check delegation review and version boundaries
        run: node --test scripts/test_delegation.mjs scripts/test_public_scope.mjs
      - name: Download and validate pinned public data and browser shell
        run: uv run --frozen python -m scripts.fetch_static_release --destination _site
      - name: Verify collected statutes and actual historical comparisons
        env:
          LAW_ORBIT_TEST_SITE: _site
        run: node --test scripts/test_delegation_collected.mjs
      - name: Compare tax evidence with independently annotated official samples
        run: uv run --frozen python -B -X utf8 -m scripts.verify_tax_citation_samples --site _site --report output/tax-citation-audit-report.json
      - name: Compare tax evidence with frozen blind source annotations
        run: uv run --frozen python -B -X utf8 -m scripts.verify_tax_citation_samples --site _site --golden docs/qa/tax-blind-samples-20261004.json --report output/tax-blind-citation-audit-report.json
      - name: Check reverse citation recall against frozen source annotations
        run: uv run --frozen python -B -X utf8 -m scripts.verify_tax_reverse_sources --site _site --golden docs/qa/tax-reverse-source-samples-20261004.json --report output/tax-reverse-source-audit-report.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public reader
        id: deployment
        uses: actions/deploy-pages@v4
