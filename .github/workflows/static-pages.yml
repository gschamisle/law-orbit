name: Publish Law Orbit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-law-galaxies-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.12.10'
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - name: Check explicit test classification before publication
        run: uv run --frozen python -m scripts.check_test_inventory
      - name: Check browser security and saved-cache boundaries
        run: |
          uv run --frozen python -m scripts.test_web_security
          node --test scripts/test_sw.mjs scripts/test_renderer_channel.mjs
      - name: Check healthcare ownership and historical article numbers
        run: uv run --frozen python -m scripts.test_healthcare_phase2
      - name: Check citation context and edition-check failure boundaries
        run: |
          uv run --frozen python -m scripts.test_citation_ownership
          uv run --frozen python -m scripts.test_edition_watch
          uv run --frozen python -m scripts.test_edition_refresh
          uv run --frozen python -m scripts.test_edition_refresh_bridges
      - name: Check static-reader engine parity
        run: uv run --frozen python -m scripts.test_static_galaxies
      - name: Check related-article reading isolation
        run: node --test scripts/test_feedback.mjs scripts/test_reading.mjs scripts/test_law_overview.mjs scripts/test_finance_guide.mjs scripts/test_annex_reading.mjs scripts/test_annex_links.mjs scripts/test_pageviews.mjs scripts/test_cross_domain.mjs scripts/test_store.mjs
      - name: Check lossless small-file packing
        run: uv run --frozen python -m scripts.test_static_storage
      - name: Check mobile map interaction and scroll mode
        run: node --test scripts/test_galaxy_gestures.cjs
      - name: Check delegation review and version boundaries
        run: node --test scripts/test_delegation.mjs scripts/test_public_scope.mjs
      - name: Download and validate pinned public data and browser shell
        run: uv run --frozen python -m scripts.fetch_static_release --destination _site
      - name: Verify finance guide against collected source editions
        run: node scripts/verify_finance_guide.mjs --site _site --report output/finance-guide-audit.json
      - name: Verify corrected citation ownership in both directions
        run: uv run --frozen python -m scripts.verify_citation_context_release --site _site --report output/citation-context-audit.json
      - name: Check ACRC ownership and official-source excerpts
        run: uv run --frozen python -m scripts.test_integrity_profile
      - name: Verify published ACRC cross-domain source chains
        run: uv run --frozen python -m scripts.verify_integrity_release --site _site --report output/integrity-source-audit.json
      - name: Check administrative remedy scope and source-bound guidance
        run: |
          uv run --frozen python -m scripts.test_remedy_profile
          node --test scripts/test_remedy.mjs
      - name: Verify published administrative remedy source chains
        run: uv run --frozen python -m scripts.verify_remedy_release --site _site --report output/remedy-source-audit.json
      - name: Verify collected statutes and actual historical comparisons
        env:
          LAW_ORBIT_TEST_SITE: _site
        run: node --test scripts/test_delegation_collected.mjs
      - name: Compare tax evidence with independently annotated official samples
        run: uv run --frozen python -B -X utf8 -m scripts.verify_tax_citation_samples --site _site --report output/tax-citation-audit-report.json
      - name: Compare tax evidence with frozen blind source annotations
        run: uv run --frozen python -B -X utf8 -m scripts.verify_tax_citation_samples --site _site --golden docs/qa/tax-blind-samples-20261004.json --report output/tax-blind-citation-audit-report.json
      - name: Check reverse citation recall against frozen source annotations
        run: uv run --frozen python -B -X utf8 -m scripts.verify_tax_reverse_sources --site _site --golden docs/qa/tax-reverse-source-samples-20261004.json --report output/tax-reverse-source-audit-report.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public reader
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
