name: Publish Law Orbit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-law-galaxies-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - name: Check static-reader engine parity
        run: uv run python -m scripts.test_static_galaxies
      - name: Check related-article reading isolation
        run: node --test scripts/test_feedback.mjs scripts/test_reading.mjs scripts/test_annex_reading.mjs scripts/test_pageviews.mjs scripts/test_cross_domain.mjs scripts/test_store.mjs
      - name: Check lossless small-file packing
        run: uv run python -m scripts.test_static_storage
      - name: Check delegation review and version boundaries
        run: node --test scripts/test_delegation.mjs scripts/test_public_scope.mjs
      - name: Download and validate pinned public data and browser shell
        run: uv run python -m scripts.fetch_static_release --destination _site
      - name: Verify collected statutes and actual historical comparisons
        env:
          LAW_ORBIT_TEST_SITE: _site
        run: node --test scripts/test_delegation_collected.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public reader
        id: deployment
        uses: actions/deploy-pages@v4
